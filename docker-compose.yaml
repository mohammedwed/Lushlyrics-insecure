

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8000"  # Host port 8002 → Container port 8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - traefik
    command: gunicorn youtify.wsgi:application --workers 3 --timeout 120 --bind 0.0.0.0:8000
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  traefik:
    image: traefik:v2.10
    ports:
      - "8080:80"  # Host port 8080 → Container port 80
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
