{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "formStyle.css" %}">
    <title>Lushlyrics | Email Sent</title>
</head>
<body>

    <div class="signup_body">
        <div class="login_form" style="text-align: center;">
            <span class='label signup-title center-align'>Check Your Inbox 📧</span>
            <p class="label center-align" style="font-size: 14px; color: #555; margin-top: 20px;">
                We've emailed you instructions for setting your password, if an account exists with the email you entered.
            </p>
            <p class="label center-align" style="font-size: 14px; color: #555;">
                You should receive them shortly. If you don't receive an email, please check your spam folder.
            </p>
            <div class="divider"></div>
            <p class='label center-align'><a href="{% url 'login' %}">Return to Log in</a>.</p>
        </div>
    </div>

</body>
</html>
