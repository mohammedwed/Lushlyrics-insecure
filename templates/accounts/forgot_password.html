{% load static %}
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://cdn.discordapp.com/icons/715958380556058684/773d6583cd1d7aef41e701783d353aef.webp?size=128" type="image/x-icon">
	<meta name="description" itemprop="description" content="Play your playlists and favourite tracks, albums, and artists" />
	<meta name="keywords" content="convert, convert playlists, transfer, syncing, smart links, free, apple music, streaming services" />
	<link rel="stylesheet" href="{% static 'formStyle.css' %}">
	<title>Forgot Password | Youttify</title>
</head>

<body>
	<div class="signup_header">
		<a href="/" target="_blank">
			<!-- Logo or homepage link -->
		</a>
	</div>

	<div class="signup_body">
		<form class="login_form" method="POST">
			{% csrf_token %}

			<span class="label signup-title center-align" style="font-size: 1.8rem; font-weight: bold;">Forgot your password?</span>
			<p class="label center-align" style="margin-bottom: 30px;">No worries! Enter your email address and we'll send you a reset link.</p>

			<label for="reset-email" class="label">
				Email address
			</label>
			<input type="email" id="reset-email" class="form_input" name="email" placeholder="Enter your email address" required>

			<button class="btn btn_log_in" type="submit" style="margin-top: 20px;">Send Reset Link</button>

			<div class="divider"></div>

			<p class="label center-align">Remembered your password?</p>
			<a class="btn btn_sign_up" href="/login">Log In</a>

			<p class="label center-align" style="margin-top: 15px;">Don't have an account yet?</p>
			<a class="btn btn_sign_up" href="/register">Sign Up for Youttify</a>
		</form>
	</div>
</body>

</html>
