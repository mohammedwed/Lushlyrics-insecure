{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Recovery</title>
    <link rel="stylesheet" href="{% static 'formStyle.css' %}">
    <style>
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="signup_body">
        <form class="login_form" method="POST">
            {% csrf_token %}
            <span class='label signup-title center-align'>Password Recovery</span>
            <p class="label">Enter your email address below to receive a password reset link.</p>

            {{ form.as_p }}

            <button class='btn btn_log_in' type="submit">Send Reset Email</button>
            <div class="divider"></div>
            <p class='label center-align'><a href="{% url 'login' %}">Back to Login</a></p>
        </form>
    </div>
</body>
</html>
